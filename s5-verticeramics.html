<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>verti ceramics · Aký hrnček hľadáte?</title><style>*{box-sizing:border-box}body{--ink:#292419;--muted:#5b5345;--paper:#f8f5ec;--accent:#e1f271;--tone:#e6e0d2;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}body.verticeramics{--ink:#39291f;--muted:#635246;--paper:#fcf6ed;--accent:#f5bc9d;--tone:#ecdaca}main,header,footer{width:min(1080px,calc(100% - 36px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--tone)}.brand{font-weight:800;letter-spacing:-.055em;font-size:1.55rem}a{color:inherit}header>a,footer>a{text-underline-offset:4px;font-size:.86rem}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:center;padding:52px 0 46px}.hero h1{font:500 clamp(2.8rem,7vw,6.2rem)/.98 Georgia,serif;letter-spacing:-.07em;margin:0;max-width:13ch}.hero p{color:var(--muted);max-width:52ch}.form{padding:22px;border:1px solid var(--tone);border-radius:18px;background:#fffdf9}.form h2{margin:0 0 12px;font-size:1.22rem}.groups{display:flex;flex-wrap:wrap;gap:7px}button{background:none;color:inherit;font:inherit;cursor:pointer;border:1px solid var(--tone);padding:7px 12px;border-radius:18px}button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #704ba3;outline-offset:3px}label{display:block;font-size:.84rem;color:var(--muted);margin:0 0 6px}select{background:#fffdf9;border:1px solid var(--tone);border-radius:7px;color:var(--ink);font:inherit;padding:7px}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 4px}.resultline{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}.resultline p,footer p{color:var(--muted);font-size:.88rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:12px}.card{background:#fffdf9;border:1px solid var(--tone);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.swatch{height:88px;background:var(--swatch);display:grid;place-items:center;color:#2f2921}.swatch:before{content:"";width:50px;height:64px;border:1px solid currentColor;border-radius:3px 7px 7px 3px;background:radial-gradient(circle,currentColor .7px,transparent .95px) 0 0/7px 7px;box-shadow:-4px 3px 0 #f8f5ec}.g-draw .swatch:before{background:#fffdf9}.g-plan .swatch:before{background:repeating-linear-gradient(transparent 0 11px,#6c645d 11px 12px),repeating-linear-gradient(90deg,#faf7f2 0 11px,#6c645d 11px 12px)}.verticeramics .swatch:before{height:49px;width:65px;border-radius:7px 7px 20px 20px;background:linear-gradient(160deg,#fdf2e3,#c3896e);box-shadow:0 5px 0 -2px #f9ebd7}.verticeramics .g-s .swatch:before{box-shadow:13px -5px 0 -5px #ae755c}.body{padding:14px;display:flex;flex-direction:column;flex:1}.body h3{line-height:1.23;font-size:1.05rem;margin:0}.body p{color:var(--muted);font-size:.88rem;margin:7px 0}.body strong{margin:auto 0 8px;padding-top:6px}.body a{background:var(--ink);color:#fff;text-decoration:none;text-align:center;padding:7px;border-radius:7px;font-size:.88rem}.body button{font-size:.82rem;margin-top:7px}.compare{margin:25px 0;padding:18px;background:var(--accent);border-radius:16px}.compare h2{margin:0 0 6px;font-size:1.12rem}.compare ul{margin:6px 0;padding-left:20px}.compare button{margin-left:8px;border-color:currentColor;font-size:.8rem}.empty{padding:28px 0}.foot{border-top:1px solid var(--tone);margin-top:36px;padding:18px 0 26px}@media(max-width:720px){.hero{grid-template-columns:1fr;padding:36px 0 19px}.hero h1{font-size:clamp(2.7rem,10vw,4rem)}}@media(max-width:370px){.grid{grid-template-columns:1fr}main,header,footer{width:calc(100% - 28px)}}
.hero-visual{margin:18px 0 0;overflow:hidden;border-radius:14px;background:#e9ddcd}
.hero-visual img{display:block;width:100%;height:clamp(160px,22vw,290px);object-fit:cover;object-position:center}
.brand-logo{height:36px;max-width:158px;display:block;object-fit:contain;object-position:left center}
.card .product-photo{display:block;background:#fffdf9}
.card .product-photo img{width:100%;height:160px;display:block;object-fit:contain}
.card .product-photo:has(img)::before{content:none}
@media(max-width:600px){.hero-visual img{height:180px}}
</style></head>
<body class="verticeramics"><header><img class="brand-logo" src="/assets/s5/verticeramics/wordmark.png" alt="verticeramics"><a href="https://www.verti-ceramics.sk/hrnceky/">Pozrite si celý sortiment</a></header>
<main><div class="hero"><div><h1>Hrnček pre váš denný rituál.</h1><p>Pre espresso aj veľký čaj. Vyberte si uško, objem a cenu.</p><figure class="hero-visual"><img src="/assets/s5/verticeramics/hero.webp" alt="verti ceramics"></figure></div><div class="form"><h2>Aký hrnček hľadáte?</h2>
<div class="groups"><button data-group="all" aria-pressed="true">Všetky hrnčeky</button><button data-group="s" aria-pressed="false">S uškom</button><button data-group="bez" aria-pressed="false">Bez uška</button></div>
<div class="filters"><div><label for="budget">Maximálna cena</label><select id="budget"><option value="">Bez limitu</option><option value="25">25</option><option value="30">30</option><option value="35">35</option><option value="40">40</option><option value="50">50</option></select></div><div><label for="size">Najmenší približný objem</label><select id="size"><option value="">Všetky objemy</option><option value="85">85</option><option value="150">150</option><option value="200">200</option><option value="300">300</option></select></div></div></div></div>
<div class="resultline"><p id="count" aria-live="polite"></p><button id="reset">Zrušiť filtre</button></div>
<section id="comparison" class="compare" hidden></section><section class="grid" id="results" aria-label="Všetky hrnčeky"></section></main>
<footer class="foot"><p>Objemy sú približné. Cenu a aktuálnu dostupnosť uvádza obchod.</p><a href="https://www.verti-ceramics.sk/hrnceky/">Pozrite si celý sortiment</a></footer>
<script type="application/json" id="catalogue">{"brand": "verti ceramics", "lang": "sk", "title": "Hrnček pre váš denný rituál.", "sub": "Pre espresso aj veľký čaj. Vyberte si uško, objem a cenu.", "currency": "EUR", "groups": {"s": "S uškom", "bez": "Bez uška"}, "question": "Aký hrnček hľadáte?", "all": "Všetky hrnčeky", "budget": "Maximálna cena", "size": "Najmenší približný objem", "comparison": "Porovnanie", "open": "Zobraziť v obchode", "compare": "Pridať na porovnanie", "remove": "Odobrať z porovnania", "nothing": "Tejto voľbe nezodpovedá žiadny hrnček.", "reset": "Zrušiť filtre", "count": "výsledkov", "url": "https://www.verti-ceramics.sk/hrnceky/", "source": "Pozrite si celý sortiment", "terms": "Objemy sú približné. Cenu a aktuálnu dostupnosť uvádza obchod.", "products": [{"name": "Hrnček bez uška COTTON tekvička 85 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cotton-tekvicka-85-ml-xs/", "spec": "cca 80 - 85 ml", "price": 20, "group": "bez", "measure": 80, "photo": "/assets/s5/verticeramics/0.webp"}, {"name": "Hrnček bez uška COTTON mini tekvička 200 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cotton-mini-tekvicka-200-ml-m/", "spec": "cca 200 - 220 ml", "price": 23, "group": "bez", "measure": 200, "photo": "/assets/s5/verticeramics/1.webp"}, {"name": "Hrnček bez uška COOKIE tekvička 320 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cookie-tekvicka-320-ml-l/", "spec": "cca 320 ml", "price": 28, "group": "bez", "measure": 320, "photo": "/assets/s5/verticeramics/2.webp"}, {"name": "Hrnček s uškom COOKIE tekvičkový tvar 160 ml", "url": "https://www.verti-ceramics.sk/hrncek-s-uskom-cookie-tekvickovy-tvar-160-ml-s/", "spec": "cca 160 - 170 ml", "price": 31, "group": "s", "measure": 160, "photo": "/assets/s5/verticeramics/3.webp"}, {"name": "Hrnček s uškom COTTON tekvičkový tvar 160 ml", "url": "https://www.verti-ceramics.sk/hrncek-s-uskom-cotton-tekvickovy-tvar-160-ml-s/", "spec": "cca 160 - 170 ml", "price": 31, "group": "s", "measure": 160, "photo": "/assets/s5/verticeramics/4.webp"}, {"name": "Hrnček s uškom DARK COTTON tekvičkový tvar 170 ml", "url": "https://www.verti-ceramics.sk/hrncek-s-uskom-dark-cotton-tekvickovy-tvar-170-ml-s/", "spec": "cca 170 - 180 ml", "price": 31, "group": "s", "measure": 170, "photo": "/assets/s5/verticeramics/5.webp"}, {"name": "Hrnček bez uška LIMONCELLO 200 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-limoncello-200-ml-m/", "spec": "cca 200 - 220 ml", "price": 32, "group": "bez", "measure": 200, "photo": "/assets/s5/verticeramics/6.webp"}, {"name": "Hrnček bez uška COOKIE Jesenná mašličková girlanda 200 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cookie-jesenna-maslickova-girlanda-200-ml-m/", "spec": "cca 200-220 ml", "price": 35, "group": "bez", "measure": 200, "photo": "/assets/s5/verticeramics/7.webp"}, {"name": "Hrnček bez uška COOKIE Jesenná mašličková girlanda 300 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cookie-jesenna-maslickova-girlanda-300-ml-l/", "spec": "cca 300-320 ml", "price": 38, "group": "bez", "measure": 300, "photo": "/assets/s5/verticeramics/8.webp"}, {"name": "Hrnček bez uška COOKIE Lemonade 200 ml", "url": "https://www.verti-ceramics.sk/hrncek-bez-uska-cookie-lemonade-200-ml-m/", "spec": "cca 200 - 220 ml", "price": 38, "group": "bez", "measure": 200, "photo": "/assets/s5/verticeramics/9.webp"}]}</script><script>
const pick=(products,group,budget,size)=>products.filter(p=>(group==="all"||p.group===group)&&p.price<=budget&&(!size||p.measure>=size));
const d=JSON.parse(document.getElementById("catalogue").textContent);
const root=document.getElementById("results"),panel=document.getElementById("comparison"),count=document.getElementById("count");
const selections=new Set();
const groups=document.querySelector(".groups"),budget=document.getElementById("budget"),size=document.getElementById("size");
let group="all";
const money=new Intl.NumberFormat(d.lang==="cs"?"cs-CZ":"sk-SK",{style:"currency",currency:d.currency,maximumFractionDigits:0});
const el=(tag,content,cl)=>{const t=document.createElement(tag);if(content!==undefined)t.textContent=content;if(cl)t.className=cl;return t};
const run=()=>{
 const rows=pick(d.products,group,Number(budget.value)||Infinity,Number(size?.value)||0);
 count.textContent=rows.length+" "+d.count;
 const tiles=rows.map(p=>{
  const card=el("article",undefined,"card g-"+p.group), swatch=el("div",undefined,"swatch"), body=el("div",undefined,"body");
  swatch.style.setProperty("--swatch",["#e8e5a9","#ead3dd","#d5e0f1","#eedbc6"][d.products.indexOf(p)%4]);swatch.setAttribute("aria-hidden","true");
  if(p.photo){
   const img=el("img");img.src=p.photo;img.alt=p.name;img.loading="lazy";
   swatch.textContent="";swatch.classList.add("product-photo");swatch.style.height="auto";swatch.removeAttribute("aria-hidden");
   img.addEventListener("error",()=>{img.remove();swatch.hidden=true;});
   swatch.append(img);
  }
  const link=el("a",d.open);link.href=p.url;
  const selected=selections.has(p);const toggle=el("button",selected?d.remove:d.compare);
  toggle.setAttribute("aria-pressed",String(selected));toggle.disabled=!selected&&selections.size===2;
  toggle.onclick=()=>{selected?selections.delete(p):selections.add(p);run();document.getElementById("comparison").scrollIntoView({block:"nearest"});};
  body.append(el("h3",p.name),el("p",p.spec),el("strong",money.format(p.price)),link,toggle);card.append(swatch,body);return card;
 });
 root.replaceChildren(...(tiles.length?tiles:[el("p",d.nothing,"empty")]));
 panel.hidden=selections.size===0;panel.replaceChildren(el("h2",d.comparison));
 const list=el("ul");for(const p of selections){const li=el("li",p.name+" · "+p.spec+" · "+money.format(p.price));const remove=el("button",d.remove);remove.onclick=()=>{selections.delete(p);run()};li.append(remove);list.append(li);}panel.append(list);
};
for(const control of groups.querySelectorAll("button"))control.onclick=()=>{group=control.dataset.group;for(const other of groups.querySelectorAll("button"))other.setAttribute("aria-pressed",String(control===other));run()};
budget.onchange=run;if(size)size.onchange=run;
document.getElementById("reset").onclick=()=>{budget.value="";if(size)size.value="";groups.querySelector("button").click()};
run();</script></body></html>
