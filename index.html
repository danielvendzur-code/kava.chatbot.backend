<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="robots" content="noindex,nofollow">
  <title>Kávový poradca – personalizovaná ukážka</title>
  <meta name="description" content="Neoficiálna interaktívna ukážka moderného kávového poradcu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get('demo')
        || location.hash.slice(1)
        || location.pathname.split('/').filter(Boolean).at(-1);
      const isKaffa = requested === 'kaffa';

      if (isKaffa) {
        document.title = 'Kaffa Roastery – návrh AI poradcu';
        document.querySelector('[name="theme-color"]').content = '#f6f3ec';
        document.querySelector('[name="description"]').content = 'Personalizovaná ukážka AI poradcu pre Kaffa Roastery.';
        document.write('<link rel="stylesheet" href="/kaffa-editorial.css"><link rel="stylesheet" href="/kaffa-widget.css"><link rel="stylesheet" href="/kaffa-director.css">');
      } else {
        document.write('<link rel="stylesheet" href="/coffee-v8.css"><link rel="stylesheet" href="/coffee-v8-refine.css">');
      }

      window.__KAFFA_EDITORIAL__ = isKaffa;
    })();
  </script>
</head>
<body>
  <div id="coffee-demo-root"></div>
  <script>
    if (window.__KAFFA_EDITORIAL__) {
      document.write('<script src="/coffee-api-route.js"><\/script><script src="/coffee-local-api.js"><\/script><script src="/kaffa-data.js"><\/script><script src="/kaffa-editorial.js"><\/script>');
    } else {
      document.write('<script src="/coffee-bootstrap.js"><\/script><script src="/coffee-api-route.js"><\/script><script src="/coffee-local-api.js"><\/script><script src="/coffee-configs.js"><\/script><script src="/coffee-brand-overrides.js"><\/script><script src="/coffee-v8.js"><\/script><script src="/coffee-v8-patch.js"><\/script>');
    }
  </script>
</body>
</html>
