<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#100c0a">
  <meta name="robots" content="noindex,nofollow">
  <title>Ukážka kávového poradcu</title>
  <meta name="description" content="Interaktívna ukážka poradcu pre výber kávy.">
  <link rel="icon" href="/brand/praziarnicka-icon-official.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="/coffee-bootstrap.js"></script>
  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const last = parts.at(-1) || 'praziarnicka';
      const queryDemo = new URLSearchParams(location.search).get('demo');
      const slug = queryDemo || (last === 'index.html' || last === 'ukazka' ? 'praziarnicka' : last);
      window.COFFEE_DEMO_SLUG = slug;
      const styles = slug === 'praziarnicka'
        ? ['/praziarnicka-v12.css']
        : ['/coffee-v8.css', '/coffee-v8-refine.css', '/coffee-premium-v2.css'];
      styles.forEach((href) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      });
    })();
  </script>
</head>
<body>
  <div id="praziarnicka-root"></div>
  <div id="coffee-demo-root"></div>
  <script src="/coffee-api-route.js"></script>
  <script src="/coffee-local-api.js"></script>
  <script>
    (() => {
      const slug = window.COFFEE_DEMO_SLUG || 'praziarnicka';
      const scripts = slug === 'praziarnicka'
        ? ['/praziarnicka-v12.js']
        : ['/coffee-configs.js', '/coffee-brand-overrides.js', '/coffee-v8.js', '/coffee-v8-patch.js', '/coffee-premium-v2.js'];
      const load = (src) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
      scripts.reduce((chain, src) => chain.then(() => load(src)), Promise.resolve())
        .catch((error) => {
          console.error('Coffee page failed to load', error);
          document.body.innerHTML = '<p style="padding:24px;font-family:system-ui">Stránku sa nepodarilo načítať.</p>';
        });
    })();
  </script>
</body>
</html>
