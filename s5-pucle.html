<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pucle · Výber puzzle</title><style>
*{box-sizing:border-box}body{background:#f7f1e7;color:#261e1b;margin:0;font:16px/1.55 system-ui,sans-serif}header,main,footer{width:min(1090px,calc(100% - 34px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d7c8b7;padding:18px 0}header b{font:bold 1.85rem Georgia,serif;letter-spacing:-.06em}a{color:inherit;text-underline-offset:4px}h1{font:500 clamp(2.9rem,8vw,7rem)/.97 Georgia,serif;margin:25px 0 14px;letter-spacing:-.07em;max-width:12ch}.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:end;padding:32px 0}fieldset{border:1px solid #d7c8b7;border-radius:12px;padding:14px 16px}legend{font-weight:bold;padding:0 4px}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}button{font:inherit;border:1px solid #b9a797;background:#fffaf1;color:#261e1b;padding:7px 12px;border-radius:20px;cursor:pointer}button[aria-pressed=true]{background:#542f73;color:white;border-color:#542f73}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #72328c;outline-offset:4px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:16px}.gallery article{border:1px solid #d7c8b7;background:#fffaf1;border-radius:14px;overflow:hidden}.cover{height:163px;background:#e4dbef;display:grid;place-items:center;color:#542f73;font:4rem Georgia,serif}.cover img{width:100%;height:163px;object-fit:contain}.detail{padding:15px}.detail p{margin:4px 0;color:#635145}.detail h2{font:1.55rem Georgia,serif;margin:3px 0}.detail a{display:inline-block;margin-top:10px;background:#261e1b;color:white;border-radius:6px;padding:7px 11px;text-decoration:none}footer{margin-top:30px;padding:16px 0;border-top:1px solid #d7c8b7;color:#635145}@media(max-width:660px){.intro{grid-template-columns:1fr;padding:14px 0}}
</style></head><body><header><b>Pucle</b><a href="https://puclepucle.com/obchod/">Celá ponuka</a></header><main>
<div class="intro"><div><h1>Nájdite puzzle, ktoré vám sadne.</h1><p>Vyberte počet dielikov a rozhodnite sa, či chcete možnosť rámu.</p></div>
<fieldset><legend>Počet dielikov</legend><div class="choices"><button aria-pressed="true" data-size="0">Všetky</button><button aria-pressed="false" data-size="100">100</button><button aria-pressed="false" data-size="200">200</button><button aria-pressed="false" data-size="500">500</button><button aria-pressed="false" data-size="1000">1000</button></div><label><input type="checkbox" id="frame"> Iba motívy s možnosťou dreveného rámu</label></fieldset></div>
<p id="status" aria-live="polite"></p><section class="gallery" id="results" aria-label="Motívy puzzle"></section></main><footer>Cenu vybraného variantu a aktuálnu dostupnosť nájdete v obchode.</footer>
<script id="products" type="application/json">[{"title":"Pálava","author":"Tomski & Polanski","pieces":[1000],"framed":true,"url":"https://puclepucle.com/produkt/palava/","image":"https://puclepucle.com/wp-content/uploads/2024/09/mockup-palava-100x100.jpg"},{"title":"Trnava","author":"CISAROVE","pieces":[1000],"framed":true,"url":"https://puclepucle.com/produkt/trnava/","image":"https://puclepucle.com/wp-content/uploads/2024/09/pucle_pucle_cisarove_24-100x100.jpg"},{"title":"Trenčín","author":"Alexander Topilin","pieces":[1000],"framed":true,"url":"https://puclepucle.com/produkt/trencin/","image":"https://puclepucle.com/wp-content/uploads/2023/07/IMG-Product-8-100x100.png"},{"title":"Asian Fusion","author":"Žužu Gálová","pieces":[1000],"framed":true,"url":"https://puclepucle.com/en/produkt/asian_fusion/","image":"https://puclepucle.com/wp-content/uploads/2024/09/Pucle-1000dilku-Zuzu.png"},{"title":"Systém","author":"Mária Čorejová","pieces":[200,500],"framed":true,"url":"https://puclepucle.com/produkt/system/","image":"https://puclepucle.com/wp-content/uploads/2023/05/maria-system-rozlozeny-tubus-600x600.jpg"},{"title":"Secret puzzle","author":"Pucle","pieces":[100,200,500,1000],"framed":false,"url":"https://puclepucle.com/produkt/secret/","image":null}]</script><script>const match=(items,size,framed)=>items.filter(p=>(!size||p.pieces.includes(size))&&(!framed||p.framed));
const products=JSON.parse(document.getElementById("products").textContent);
const results=document.getElementById("results"), status=document.getElementById("status"), frame=document.getElementById("frame");
let size=0;const node=(type,txt)=>{const n=document.createElement(type);if(txt!==undefined)n.textContent=txt;return n};
const render=()=>{
 const list=match(products,size,frame.checked);status.textContent=list.length===0?"V ukážke nie je motív pre túto kombináciu.":list.length===1?"1 motív":list.length<5?list.length+" motívy":list.length+" motívov";
 results.replaceChildren(...list.map(p=>{
  const card=node("article"), cover=node("div");cover.className="cover";
  if(p.image){const img=node("img");img.src=p.image;img.alt=p.title;img.loading="lazy";img.addEventListener("error",()=>img.remove());cover.append(img)}else{cover.append(node("span","?"));cover.setAttribute("aria-hidden","true")}
  const detail=node("div");detail.className="detail";const link=node("a","Otvoriť v obchode");link.href=p.url;
  detail.append(node("p",p.author),node("h2",p.title),node("p",p.pieces.join(" / ")+" dielikov · "+(p.framed?"s rámom alebo bez rámu":"bez rámu")),link);card.append(cover,detail);return card;
 }));
};
document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{size=Number(b.dataset.size);document.querySelectorAll("[data-size]").forEach(x=>x.setAttribute("aria-pressed",String(b===x)));render()});
frame.onchange=render;render();</script></body></html>
