<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14110F">
  <meta name="robots" content="noindex,nofollow">
  <title>Pražiareň Jolka – kávový poradca</title>
  <meta name="description" content="Ukážka kávového poradcu pripravená pre Pražiareň Jolka.">
  <link rel="icon" href="/assets/jolka/logo-badge.webp" type="image/webp">
  <link rel="preload" as="font" type="font/woff2" href="/assets/jolka/fonts/inter-latin-ext.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/jolka/fonts/playfair-latin-ext.woff2" crossorigin>
  <link rel="preload" as="image" href="/assets/jolka/hero-bags.webp">
  <link rel="stylesheet" href="/jolka/jolka.css">
  <link rel="stylesheet" href="/coffee-accessibility-preserve.css">
  <style>
    @media (min-width:1081px) and (max-height:850px) {
      html, body { height:100%; overflow-y:hidden; }
      .page { height:100dvh; min-height:0; padding:16px 32px 14px; gap:12px; overflow:hidden; }
      .hero { min-height:0; gap:36px; }
      .eyebrow { margin-bottom:8px; }
      .hero h1 { font-size:clamp(32px,3vw,42px); margin-bottom:10px; }
      .hero__lead { font-size:15.5px; line-height:1.42; margin-bottom:12px; }
      .benefits { gap:8px; margin-bottom:12px; }
      .benefit { padding:9px 11px 10px; }
      .benefit__num { font-size:17px; margin-bottom:5px; }
      .benefit b { font-size:14px; }
      .benefit span { font-size:12px; line-height:1.3; }
      .hero__actions { gap:12px; }
      .page .cta { padding:13px 22px; font-size:15px; }
      .hero__hint { font-size:12.5px; }
      .showcase__frame { height:min(400px,52vh); aspect-ratio:auto; padding:42px 26px 0; }
      .showcase__card { right:-4px; bottom:14px; width:260px; padding:12px; }
      .page__footer { padding-top:9px; }
      .perks { gap:8px 18px; margin-bottom:6px; }
      .perks b { font-size:13px; margin-bottom:1px; }
      .perks span { font-size:11.5px; line-height:1.3; }
      .page__by { font-size:11.5px; }
    }
    .launcher { bottom:34px; gap:17px; }
    .launcher__teaser { max-width:280px; padding:16px 18px; }
    .launcher__teaser b { font-size:15px; }
    .launcher__teaser span { font-size:13.5px; }
    .launcher__button { width:72px; height:72px; }
    .entry[hidden] { display:none !important; }
    @media (max-width:640px) {
      .launcher { right:16px; bottom:max(18px,env(safe-area-inset-bottom)); gap:12px; }
      .launcher__teaser { max-width:min(276px,calc(100vw - 92px)); padding:15px 17px; }
      .launcher__button { width:68px; height:68px; }
    }
  </style>
</head>
<body>
  <div id="jolka-root"></div>
  <script src="/coffee-api-route.js"></script>
  <script src="/jolka/jolka-data.js"></script>
  <script src="/jolka/jolka-app.js"></script>
  <script src="/jolka/jolka-chat-flow.js"></script>
  <script src="/coffee-usability-release.js"></script>
  <script src="/coffee-owner-conversion.js"></script>
  <script src="/jolka/jolka-header-polish.js"></script>
  <link rel="stylesheet" href="/jolka-header-polish.css">
  <link rel="stylesheet" href="/coffee-review-pass.css">
  <script src="/coffee-review-pass.js"></script>
  <link rel="stylesheet" href="/coffee-final-tune.css">
  <script src="/coffee-final-tune.js"></script>
</body>
</html>
