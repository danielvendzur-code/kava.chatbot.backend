name: Clean up old Vercel deployments

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-deployment-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete known stale deployments; keep two protected
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_wCzamTfbYrn2asWAU0agL3yoF7nD
          VERCEL_TEAM_ID: team_xJCHkDHUMXQ0lqpImtY3Fbvr
          PROTECTED_DEPLOYMENT_1: dpl_EB6anDoPNsjRPzdyC7EnSBvG18wG
          PROTECTED_DEPLOYMENT_2: dpl_9JQ2vbVCtPTu2HqLQq12W4rNw99L
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.vercel.com"

          for protected in "$PROTECTED_DEPLOYMENT_1" "$PROTECTED_DEPLOYMENT_2"; do
            detail=$(curl --fail-with-body -sS -H "Authorization: Bearer $VERCEL_TOKEN"               "$api/v13/deployments/$protected?teamId=$VERCEL_TEAM_ID")
            project_id=$(jq -r '.projectId // .project.id // empty' <<<"$detail")
            state=$(jq -r '.readyState // .state // empty' <<<"$detail")
            test "$project_id" = "$VERCEL_PROJECT_ID"
            test "$state" = "READY"
            echo "KEEP $protected"
          done

          stale=(
            dpl_8xzCDQhkUj9cwm2CUSSgEbs5oHdV
            dpl_BNjJi2hXpyNfyHT9yqVAj3jhvnoC
            dpl_ACD93TxJ9aE3eDXJzFMJ6gbDh4h8
            dpl_xmuoFsi9zCapuNGMDf1C9XTnYocC
            dpl_FPxm3aMgEVsJA8z2UhSf6AtHegCC
            dpl_6kwB4a4YEtuuS5NbQEpaYrNryAcy
          )

          deleted=0
          skipped=0
          for id in "${stale[@]}"; do
            if [ "$id" = "$PROTECTED_DEPLOYMENT_1" ] || [ "$id" = "$PROTECTED_DEPLOYMENT_2" ]; then
              echo "REFUSE protected $id"
              exit 1
            fi

            out=$(mktemp)
            code=$(curl -sS -o "$out" -w "%{http_code}"               -H "Authorization: Bearer $VERCEL_TOKEN"               "$api/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" || true)

            if [ "$code" = "404" ]; then
              echo "ALREADY GONE $id"
              rm -f "$out"
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "SKIP unreadable $id http=$code"
              cat "$out" || true
              rm -f "$out"
              skipped=$((skipped+1))
              continue
            fi

            project_id=$(jq -r '.projectId // .project.id // empty' "$out")
            rm -f "$out"
            if [ "$project_id" != "$VERCEL_PROJECT_ID" ]; then
              echo "REFUSE wrong-project $id project=$project_id"
              skipped=$((skipped+1))
              continue
            fi

            out=$(mktemp)
            code=$(curl -sS -o "$out" -w "%{http_code}" -X DELETE               -H "Authorization: Bearer $VERCEL_TOKEN"               "$api/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" || true)
            body=$(cat "$out" || true)
            rm -f "$out"

            if [ "$code" = "200" ] || [ "$code" = "204" ] || [ "$code" = "404" ]; then
              echo "DELETED $id"
              deleted=$((deleted+1))
            else
              echo "DELETE FAILED $id http=$code body=$body"
              skipped=$((skipped+1))
            fi
          done

          echo "RESULT deleted=$deleted skipped=$skipped"
