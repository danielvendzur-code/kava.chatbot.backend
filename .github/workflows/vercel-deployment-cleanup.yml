name: Clean up old Vercel deployments

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete safe redundant deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_wCzamTfbYrn2asWAU0agL3yoF7nD
          VERCEL_TEAM_ID: team_xJCHkDHUMXQ0lqpImtY3Fbvr
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }

          api="https://api.vercel.com"
          tmp=$(mktemp)
          cursor=""

          # Collect the deployment list before deleting anything so pagination cannot shift under us.
          while :; do
            url="$api/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=100"
            [ -n "$cursor" ] && url="$url&until=$cursor"
            page=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$url")
            jq -c '.deployments[]' <<<"$page" >> "$tmp"
            next=$(jq -r '.pagination.next // empty' <<<"$page")
            [ -n "$next" ] || break
            cursor="$next"
          done

          total=$(wc -l < "$tmp" | tr -d ' ')
          echo "Found $total deployments"

          # Keep every production deployment for maximum safety, plus five rollback
          # previews for each active demo branch. Delete only redundant previews.
          skincare_kept=0
          coffee_kept=0
          kept=0
          deleted=0
          skipped=0

          while IFS= read -r deployment; do
            id=$(jq -r '.uid // .id // empty' <<<"$deployment")
            target=$(jq -r '.target // ""' <<<"$deployment")
            branch=$(jq -r '.meta.githubCommitRef // ""' <<<"$deployment")

            if [ -z "$id" ]; then
              echo "SKIP deployment without id"
              skipped=$((skipped+1))
              continue
            fi

            if [ "$target" = "production" ]; then
              echo "KEEP production $id"
              kept=$((kept+1))
              continue
            fi

            if [ "$branch" = "fix/final-coffee-skincare-demos-20260913" ] && [ "$skincare_kept" -lt 5 ]; then
              echo "KEEP skincare rollback $id"
              skincare_kept=$((skincare_kept+1))
              kept=$((kept+1))
              continue
            fi

            if [ "$branch" = "migration/coffee-only-final-20260913" ] && [ "$coffee_kept" -lt 5 ]; then
              echo "KEEP coffee rollback $id"
              coffee_kept=$((coffee_kept+1))
              kept=$((kept+1))
              continue
            fi

            # Re-check the exact deployment before DELETE. Never delete production,
            # another project, or a deployment carrying a mojchatbot.sk alias.
            detail=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$api/v13/deployments/$id?teamId=$VERCEL_TEAM_ID") || {
                echo "SKIP unreadable $id"
                skipped=$((skipped+1))
                continue
              }

            detail_project=$(jq -r '.projectId // ""' <<<"$detail")
            detail_target=$(jq -r '.target // ""' <<<"$detail")
            alias_match=$(jq -r '([.alias // []] | map(select(type == "string" and endswith("mojchatbot.sk"))) | length) > 0' <<<"$detail")

            if [ "$detail_project" != "$VERCEL_PROJECT_ID" ] || [ "$detail_target" = "production" ] || [ "$alias_match" = "true" ]; then
              echo "KEEP protected $id"
              kept=$((kept+1))
              continue
            fi

            if curl --fail-with-body -sS -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$api/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" >/dev/null; then
              echo "DELETED $id branch=${branch:-none}"
              deleted=$((deleted+1))
            else
              echo "SKIP delete-error $id"
              skipped=$((skipped+1))
            fi
          done < "$tmp"

          rm -f "$tmp"
          echo "RESULT kept=$kept deleted=$deleted skipped=$skipped skincare_rollbacks=$skincare_kept coffee_rollbacks=$coffee_kept"
