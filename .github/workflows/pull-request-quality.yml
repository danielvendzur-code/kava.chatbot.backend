name: Pull request quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kava-widget-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Validate final six-demo architecture
        run: |
          test -f index.html
          test -f coffee-final-entry.js
          test -f coffee-api-route.js
          test -f coffee-local-api.js
          test -f api/chat.js
          test -f vercel.json
          test -f praziarnicka-v13.css
          test -f praziarnicka-v13.js
          grep -Fq 'coffee-final-entry.js' index.html
          for slug in praziarnicka diamonds kaffa vitazov concept jolka; do grep -Fq "$slug" coffee-final-entry.js || test "$slug" = jolka; done
          grep -Fq 'praziarnicka-v13.css' coffee-final-entry.js
          grep -Fq 'praziarnicka-v13.js' coffee-final-entry.js
          grep -Fq '/ukazka/jolka' vercel.json
          grep -Fq '/ukazka/:slug' vercel.json
          grep -Fq "praziarnicka:" api/chat.js
          grep -Fq "diamonds:" api/chat.js
          grep -Fq "kaffa:" api/chat.js
          grep -Fq "vitazov:" api/chat.js
          grep -Fq "concept:" api/chat.js
          grep -Fq "jolka:" api/chat.js
          grep -Fq 'ANTHROPIC_API_KEY' api/chat.js
          grep -Fq "return nativeFetch('/api/chat', init)" coffee-api-route.js
          node --check coffee-bootstrap.js
          node --check coffee-final-entry.js
          node --check coffee-local-api.js
          node --check coffee-configs.js
          node --check coffee-brand-overrides.js
          node --check coffee-vitazov-overrides.js
          node --check coffee-v8.js
          node --check praziarnicka-v13.js
          node --check concept-seasonal-init.js
          node --check kaffa-editorial.js
          node --check kaffa-final.js
          node --check coffee-vitazov-final.js
          node --check coffee-diamonds-final.js
          node --check api/chat.js

      - name: Validate brand contract tests
        run: |
          node --test \
            tests/praziarnicka-contract.test.mjs \
            tests/diamonds-contract.test.mjs \
            tests/concept-seasonal.contract.test.mjs \
            tests/kaffa-contract.test.mjs \
            tests/vitazov-contract.test.mjs

      - name: Validate Jolka is unchanged and standalone
        run: |
          test -f jolka.html
          test -f jolka/jolka.css
          test -f jolka/jolka-data.js
          test -f jolka/jolka-app.js
          grep -Fq '/jolka/jolka.css' jolka.html
          grep -Fq '/jolka/jolka-data.js' jolka.html
          grep -Fq '/jolka/jolka-app.js' jolka.html
          grep -Fq '"/ukazka/jolka"' vercel.json
          grep -Fq "location.replace('/jolka.html')" coffee-bootstrap.js
          grep -Fq 'praziarenjolka.sk/eshop-kava/' api/chat.js
          ! grep -Fq 'praziarenjolka.sk/shop/' api/chat.js
          ! grep -Fq 'praziarenjolka.sk/shop/' jolka/jolka-data.js
          ! grep -Fq 'produkt/el-salvador-shg-ep' jolka/jolka-data.js
          ! grep -Eq 'tel:|mailto:' jolka.html jolka/jolka-app.js jolka/jolka-data.js
          test "$(ls jolka/*.css | wc -l)" -eq 1
          test "$(ls assets/jolka/method/*.webp | wc -l)" -eq 7
          test "$(ls assets/jolka/tile/*.webp | wc -l)" -eq 14
          node --check jolka/jolka-data.js
          node --check jolka/jolka-app.js

      - name: Run integrated desktop and mobile Chromium tests
        run: |
          python3 -m http.server 4173 >/tmp/kava-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-final-visual-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
