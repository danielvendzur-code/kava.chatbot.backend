name: Pull request quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kava-widget-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate active v7 architecture
        run: |
          test -f coffee-v7.css
          test -f coffee-v7.js
          grep -Fq 'coffee-v7.css' index.html
          grep -Fq 'coffee-v7.js' index.html
          grep -Fq 'Neoficiálny návrh pripravený pre Pražiarničku' index.html
          grep -Fq 'support-row' index.html
          grep -Fq 'grid-template-columns: repeat(2' coffee-v7.css
          grep -Fq 'background-image: radial-gradient' coffee-v7.css
          grep -Fq 'praziarnicka-demo-events' coffee-v7.js

      - name: Run desktop and mobile Chromium tests
        run: |
          python3 -m http.server 4173 >/tmp/kava-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praziarnicka-v7-visual-qa
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 7
