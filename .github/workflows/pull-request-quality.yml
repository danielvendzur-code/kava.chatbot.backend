name: Pull request quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kava-widget-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Validate clean Jolka-based coffee architecture
        run: |
          test -f index.html
          test -f coffee-final-entry.js
          test -f coffee-api-route.js
          test -f coffee-local-api.js
          test -f coffee-jolka-app.js
          test -f coffee-jolka-shell.css
          test -f tests/full-coffee-release-audit.spec.mjs
          test -f api/chat.js
          test -f vercel.json
          grep -Fq 'coffee-final-entry.js' index.html
          for slug in praziarnicka diamonds kaffa vitazov concept; do
            test -f "$slug.html"
            test -f "$slug-jolka-data.js"
            test -f "$slug-jolka-theme.css"
            grep -Fq '/jolka/jolka.css' "$slug.html"
            grep -Fq '/coffee-jolka-shell.css' "$slug.html"
            grep -Fq "/$slug-jolka-data.js" "$slug.html"
            grep -Fq "/$slug-jolka-theme.css" "$slug.html"
            grep -Fq '/coffee-jolka-app.js' "$slug.html"
            ! grep -Eq 'coffee-owner-brand|coffee-final-tune|coffee-last-mile|coffee-release-authority' "$slug.html"
            grep -Fq "$slug" coffee-final-entry.js
            node --check "$slug-jolka-data.js"
          done
          grep -Fq 'jolka' coffee-final-entry.js
          grep -Fq '/ukazka/jolka' vercel.json
          grep -Fq '/ukazka/:slug' vercel.json
          for slug in praziarnicka diamonds kaffa vitazov concept jolka; do grep -Fq "$slug:" api/chat.js; done
          grep -Fq 'ANTHROPIC_API_KEY' api/chat.js
          grep -Fq "return nativeFetch('/api/chat', init)" coffee-api-route.js
          node --check coffee-final-entry.js
          node --check coffee-jolka-app.js
          node --check coffee-local-api.js
          node --check api/chat.js

      - name: Validate cosmetics demo architecture
        run: |
          test -f cosmetics.html
          test -f cosmetics.css
          test -f cosmetics-config.js
          test -f cosmetics.js
          test -f api/cosmetics-chat.js
          test -f tests/cosmetics.spec.mjs
          grep -Fq '/kozmetika/:slug' vercel.json
          for slug in mylo ponio two bellcoria biofy anemone; do grep -Fq "$slug:" cosmetics-config.js; done
          grep -Fq "fetch('/api/cosmetics-chat'" cosmetics.js
          grep -Fq 'ANTHROPIC_API_KEY' api/cosmetics-chat.js
          node --check cosmetics-config.js
          node --check cosmetics.js
          node --check api/cosmetics-chat.js

      - name: Validate existing coffee content contracts
        run: |
          node --test \
            tests/praziarnicka-contract.test.mjs \
            tests/diamonds-contract.test.mjs \
            tests/concept-seasonal.contract.test.mjs \
            tests/kaffa-contract.test.mjs \
            tests/vitazov-contract.test.mjs

      - name: Validate untouched Jolka benchmark
        run: |
          test -f jolka.html
          test -f jolka/jolka.css
          test -f jolka/jolka-data.js
          test -f jolka/jolka-app.js
          test -f jolka/jolka-chat-flow.js
          grep -Fq '/jolka/jolka.css' jolka.html
          grep -Fq '/jolka/jolka-data.js' jolka.html
          grep -Fq '/jolka/jolka-app.js' jolka.html
          grep -Fq '/jolka/jolka-chat-flow.js' jolka.html
          grep -Fq '/coffee-release-contract.css' jolka.html
          grep -Fq '/coffee-release-contract.js' jolka.html
          grep -Fq '"/ukazka/jolka"' vercel.json
          grep -Fq "location.replace('/jolka.html')" coffee-bootstrap.js
          grep -Fq 'praziarenjolka.sk/eshop-kava/' api/chat.js
          ! grep -Fq 'praziarenjolka.sk/shop/' api/chat.js
          ! grep -Fq 'praziarenjolka.sk/shop/' jolka/jolka-data.js
          ! grep -Fq 'produkt/el-salvador-shg-ep' jolka/jolka-data.js
          ! grep -Eq 'tel:|mailto:' jolka.html jolka/jolka-app.js jolka/jolka-data.js
          test "$(ls jolka/*.css | wc -l)" -eq 1
          test "$(ls assets/jolka/method/*.webp | wc -l)" -eq 7
          test "$(ls assets/jolka/tile/*.webp | wc -l)" -eq 14
          node --check jolka/jolka-data.js
          node --check jolka/jolka-app.js
          node --check jolka/jolka-chat-flow.js

      - name: Run integrated desktop and mobile Chromium tests
        run: |
          python3 -m http.server 4173 >/tmp/kava-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-demo-visual-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
