name: Pull request quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kava-widget-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Validate shared v8 architecture
        run: |
          test -f coffee-v8.css
          test -f coffee-v8.js
          test -f coffee-configs.js
          test -f api/chat.js
          test -f vercel.json
          grep -Fq 'coffee-v8.css' index.html
          grep -Fq 'coffee-configs.js' index.html
          grep -Fq 'border-radius: 50%' coffee-v8.css
          grep -Fq 'background-size 1.05s' coffee-v8.css
          grep -Fq 'option-reveal' coffee-v8.css
          grep -Fq "praziarnicka:" coffee-configs.js
          grep -Fq "diamonds:" coffee-configs.js
          grep -Fq "kaffa:" coffee-configs.js
          grep -Fq "vitazov:" coffee-configs.js
          grep -Fq "concept:" coffee-configs.js
          grep -Fq "jolka:" coffee-configs.js
          grep -Fq 'ANTHROPIC_API_KEY' api/chat.js
          grep -Fq '/ukazka/:slug' vercel.json
          ! grep -Fq 'Voľba je uložená' coffee-v8.js
          node --check coffee-bootstrap.js
          node --check coffee-local-api.js
          node --check coffee-configs.js
          node --check coffee-brand-overrides.js
          node --check coffee-v8.js
          node --check coffee-v8-patch.js
          node --check api/chat.js

      - name: Validate Jolka entry point
        run: |
          test -f jolka.html
          test -f jolka/jolka.css
          test -f jolka/jolka-data.js
          test -f jolka/jolka-app.js
          grep -Fq '/jolka/jolka.css' jolka.html
          grep -Fq '/jolka/jolka-data.js' jolka.html
          grep -Fq '/jolka/jolka-app.js' jolka.html
          grep -Fq '"/ukazka/jolka"' vercel.json
          grep -Fq "location.replace('/jolka.html')" coffee-bootstrap.js
          grep -Fq 'praziarenjolka.sk/eshop-kava/' api/chat.js
          # the shop path that used to 404 must not come back
          ! grep -Fq 'praziarenjolka.sk/shop/' api/chat.js
          ! grep -Fq 'praziarenjolka.sk/shop/' jolka/jolka-data.js
          # the sold-out single origin must not be recommended (it is still fine as a
          # named component of the house blends) and no customer contact block anywhere
          ! grep -Fq 'produkt/el-salvador-shg-ep' jolka/jolka-data.js
          ! grep -Eq 'tel:|mailto:' jolka.html jolka/jolka-app.js jolka/jolka-data.js
          # single stylesheet, no refine/override/patch layers for Jolka
          test "$(ls jolka/*.css | wc -l)" -eq 1
          test -f assets/jolka/logo-ink.webp
          test -f assets/jolka/logo-badge.webp
          test -f assets/jolka/hero-bags.webp
          test "$(ls assets/jolka/*.webp | wc -l)" -ge 15
          test "$(ls assets/jolka/method/*.webp | wc -l)" -eq 7
          test "$(ls assets/jolka/tile/*.webp | wc -l)" -eq 14
          test -f assets/jolka/method/SOURCES.md
          node --check jolka/jolka-data.js
          node --check jolka/jolka-app.js

      - name: Run desktop and mobile Chromium tests
        run: |
          python3 -m http.server 4173 >/tmp/kava-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-v8-visual-qa
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 7
