name: Six coffee audits

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'
      - 'tests/**'
      - '.github/workflows/coffee-six-audit.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit-${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [praziarnicka, jolka, kaffa, concept, vitazov, diamonds]
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run independent audit
        env:
          AUDIT_DEMO: ${{ matrix.demo }}
        run: |
          python3 -m http.server 4173 >/tmp/kava-${{ matrix.demo }}.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test tests/coffee-agent-audit.spec.mjs --reporter=line --workers=1

      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-audit-${{ matrix.demo }}
          path: artifacts/agent-${{ matrix.demo }}/
          if-no-files-found: ignore
          retention-days: 7
