<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d3b">
  <meta name="robots" content="noindex,nofollow">
  <title>Concept Coffee Roasters – kávový poradca</title>
  <meta name="description" content="Ukážka kávového poradcu pripravená pre Concept Coffee Roasters.">
  <link rel="icon" href="/brand/concept-official-logo.png" type="image/png">
  <link rel="preload" as="font" type="font/woff2" href="/assets/jolka/fonts/inter-latin-ext.woff2" crossorigin>

      html,body{height:100%;overflow-y:hidden}.page{height:100dvh;min-height:0;padding:16px 32px 14px;gap:12px;overflow:hidden}

    .launcher{bottom:34px;gap:17px}.launcher__teaser{max-width:280px;padding:16px 18px}.launcher__button{width:72px;height:72px}.entry[hidden]{display:none!important}
